name: Font audit (research)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/font-audit.mjs"]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/font-audit.mjs
      - run: |
          git config user.name "khabaru-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/fonts.json
          git diff --cached --quiet || git commit -m "Font audit $(date -u +%FT%TZ)"
          git pull --rebase origin main
          git push
