name: Fetch news feeds
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: feeds
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-feeds.mjs
      - name: Commit feeds.json
        run: |
          git config user.name "khabaru-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/feeds.json
          git diff --cached --quiet || git commit -m "Update feeds $(date -u +%FT%TZ)"
          git push
