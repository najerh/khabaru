<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">

<title>ޚަބަރު - Thaana News App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thaana:wght@400;500;700;800&display=swap">
<style>
@font-face{font-family:'MV Faseyha';src:url('fonts/MVFaseyha-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'MV Faseyha';src:url('fonts/MVFaseyha-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
@font-face{font-family:'MV AammuFK';src:url('fonts/MVAammuFK.ttf') format('truetype');font-weight:400 800;font-display:swap}
:root{
--bg:#F2F2F7;--card:#FFFFFF;--raised:#EFEFF4;--line:#E5E5EA;--text:#000;--soft:#3C3C43;--muted:#8E8E93;--accent:#FF375F;
--green:#5DBB7E;--orange:#F39A37;--nav:rgba(246,246,248,.78);--navline:rgba(0,0,0,.06);--navon:rgba(0,0,0,.07);--shadow:0 10px 30px rgba(0,0,0,.12);--photo:#D9D9DE;--strip:#EBEBF0;
--f-mast:'MV AammuFK','Noto Sans Thaana',sans-serif;
--f-head:'MV Faseyha','Noto Sans Thaana',sans-serif;
--f-ui:'MV Faseyha','Noto Sans Thaana',sans-serif;
--f-body:'MV Faseyha','Noto Sans Thaana',sans-serif;
}
@media (prefers-color-scheme:dark){:root{
--bg:#000;--card:#1C1C1E;--raised:#2C2C2E;--line:#38383A;--text:#fff;--soft:#C7C7CC;--muted:#8E8E93;--green:#5DBB7E;--orange:#F39A37;
--nav:rgba(40,40,44,.72);--navline:rgba(255,255,255,.12);--navon:rgba(255,255,255,.1);--shadow:0 10px 30px rgba(0,0,0,.6);--photo:#2C2C2E;--strip:#2C2C2E}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--f-ui);line-height:1.8;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:right;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:active{opacity:.7}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:20px 16px 130px}
/* The title font has one weight; a hairline stroke brings it nearer Apple's bold. */
.mast{-webkit-text-stroke:.35px currentColor}
.mast{font-family:var(--f-mast);font-weight:400;line-height:1.35;margin:0}
.m1{font-size:36px;line-height:1.05}.m2{font-size:34px;line-height:1.05;color:var(--muted);margin-top:4px}
.masthead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.cta{flex:none;height:44px;padding:0 18px;border-radius:22px;background:var(--accent);color:#fff;font-size:17px;display:flex;align-items:center;gap:8px;margin-top:4px}
.cta.ghost{background:var(--card);color:var(--text)}
h2.mast{font-size:28px;margin:34px 0 10px;line-height:1.3}
.hrow{display:flex;align-items:center;justify-content:space-between}
.hrow .circle{width:32px;height:32px;margin-top:24px;background:var(--line)}
.sub{font-size:15px;color:var(--muted);margin:-8px 0 12px}
.accent{color:var(--accent)}.green{color:var(--green)}.orange{color:var(--orange)}
.muted{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:18px -16px 0;padding:4px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;line-height:36px;padding:0 16px;border-radius:18px;background:var(--card);font-size:16px}
.card{display:block;width:100%;border-radius:18px;overflow:hidden;background:var(--card);margin-bottom:10px;text-align:right}
.cardbtn{display:block;width:100%;text-align:right}
.photo{display:block;background:var(--photo);overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.ph43{width:100%;aspect-ratio:4/3}
.phsq{width:120px;height:120px;flex:none;border-radius:10px}
.pad{padding:12px 14px 8px}
.chn{font-family:var(--f-head);font-weight:700;font-size:15px;color:var(--text);line-height:1.5}
.hl{font-family:var(--f-head);font-weight:700;line-height:1.45;margin:2px 0 0;overflow-wrap:anywhere}
.card .hl,.trow .hl{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.pill{display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:17px;background:var(--raised);font-size:14px;color:var(--text)}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;min-height:34px}
.dots{width:40px;height:34px;display:flex;align-items:center;justify-content:flex-end;color:var(--muted)}
.strip{padding:5px 14px;background:var(--strip);font-size:14px;color:var(--text)}
.fresh{padding:4px 14px;font-size:13px;letter-spacing:.02em;color:#fff;background:linear-gradient(270deg,#E8503A,rgba(232,80,58,.25))}
.row{display:flex;gap:12px;align-items:flex-start}
.grow{flex:1 1 0;min-width:0}
.meta{font-size:15px;color:var(--muted);line-height:1.5}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}
.grid2 .card{margin:0;display:flex;flex-direction:column}
.grid2 .pad{flex:1 1 auto;display:flex;flex-direction:column}
.more{margin:0 14px;padding:10px 0 6px;border-top:1px solid var(--line)}
.more h3{margin:0 0 4px;font-family:var(--f-ui);font-size:17px;font-weight:700}
.mrow{color:inherit;text-decoration:none;display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:6px 0;text-align:right}
.mrow span.t{font-size:16px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;line-height:1}
.promo{display:flex;align-items:stretch;width:100%;height:56px;border-radius:14px;overflow:hidden;background:var(--card);margin:12px 0 0;text-align:right}
.promo .tx{flex:1 1 0;padding:6px 14px;line-height:1.4;display:flex;flex-direction:column;justify-content:center}
.promo .tx b{font-family:var(--f-ui);font-weight:700;font-size:17px}
.promo .tx span{font-size:13px;color:var(--soft)}
.promo .art{width:76px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,22% 100%);display:flex;align-items:center;justify-content:center;color:#fff;padding-inline-start:10px}
[dir=rtl] .promo .art{clip-path:polygon(0 0,100% 0,78% 100%,0 100%);padding-inline-start:0;padding-inline-end:10px}
.tiles2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ftile{height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--f-head);font-weight:700;font-size:17px;text-align:center;padding:0 10px;white-space:nowrap;overflow:hidden}
.ftile.plain{background:var(--card);color:var(--text)}
.wide{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;margin-top:18px;border-radius:18px;background:var(--line);color:var(--accent);font-size:17px}
.rank{width:44px;height:44px;flex:none;border-radius:22px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-family:var(--f-mast);margin-top:2px}
.trow{display:flex;gap:14px;align-items:flex-start;padding:8px 0 12px;width:100%;text-align:right}
.group{border-radius:20px;background:var(--card);padding:0 16px;margin-bottom:8px}
.group>*{display:flex;align-items:center;gap:14px;min-height:52px;width:100%;border-bottom:1px solid var(--line);text-align:right}
.group>*:last-child{border-bottom:0}
.glabel{display:flex;align-items:center;justify-content:space-between;width:100%;margin:22px 0 8px;padding:0 16px;font-size:20px;color:var(--muted);min-height:44px}
.sq{width:30px;height:30px;flex:none;border-radius:7px;display:flex;align-items:center;justify-content:center}
.follow{height:34px;padding:0 14px;border-radius:17px;background:var(--raised);color:var(--text);font-size:14px}
.follow.on{background:var(--accent);color:#fff}
.circle{width:44px;height:44px;border-radius:22px;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--text)}
.pillbar{display:flex;align-items:center;height:44px;border-radius:22px;background:var(--card);padding:0 6px}
.pillbar button{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.topbar{display:flex;justify-content:space-between;align-items:center}
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:22px;background:var(--card);margin:18px 0 20px}
.search input,.cform input{flex:1 1 0;min-width:0;height:44px;border:0;background:none;color:var(--text);font:inherit;font-size:17px}
input::placeholder{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;height:98px;display:flex;align-items:flex-end;padding:8px 12px;border-radius:14px;color:#fff;font-family:var(--f-head);font-weight:700;font-size:18px;line-height:1.5;overflow:hidden}
.tile svg{position:absolute;inset-inline-end:-6px;bottom:-10px;opacity:.28}
.body{font-family:var(--f-body);font-size:19px;line-height:2.1;color:var(--text);margin:14px 0}
.readon{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:6px 16px;border-radius:26px;background:var(--accent);color:#fff;font-size:17px;text-decoration:none;margin:18px 0 6px;text-align:center}
.srclink{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--accent);font-size:15px;text-decoration:none}
.cov{color:inherit;text-decoration:none;padding:10px 0}
.cov .t{font-size:16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.like{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:22px;background:var(--raised);color:var(--text);font-size:15px}
.like.on{background:var(--accent);color:#fff}
.comment{padding:12px 16px;border-radius:16px;background:var(--card);margin-bottom:12px}
.cform{display:flex;gap:8px;align-items:center}
.cform input{height:48px;padding:0 16px;border-radius:24px;background:var(--card);font-size:16px}
.send{height:48px;padding:0 18px;border-radius:24px;background:var(--accent);color:#fff;font-size:15px}
.note{padding:12px;border-radius:14px;background:var(--card);font-size:13px;color:var(--soft);margin-top:16px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;width:calc(100% - 40px);max-width:440px;height:64px;padding:4px;display:flex;gap:4px;border-radius:32px;border:1px solid var(--navline);background:var(--nav);-webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);box-shadow:var(--shadow)}
nav button{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:28px;font-size:12px;line-height:1.4;gap:0;color:var(--text)}
nav button.on{background:var(--navon);color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
#side{display:none}
.g3,.g4{display:grid;gap:14px;margin-bottom:14px;align-items:stretch}
.g3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.g3>.card{margin:0;display:flex;flex-direction:column}
.g3>.card>.pad,.g3>.card>.cardbtn>.pad{flex:1 1 auto;display:flex;flex-direction:column}
.g3>.card>.cardbtn{display:flex;flex-direction:column;flex:1 1 auto}
.g3 .foot{margin-top:auto;padding-top:10px}
.g3>.trow{padding:4px 0}
.rule{border:0;border-top:1px solid var(--line);margin:4px 0 0}
@media (min-width:900px){
  nav{display:none}
  #side{display:block;position:fixed;inset-inline-start:12px;top:12px;bottom:12px;width:296px;border-radius:24px;background:var(--card);box-shadow:0 4px 24px rgba(0,0,0,.08);overflow-y:auto;padding:14px 12px 20px;z-index:10;scrollbar-width:none}
  #side::-webkit-scrollbar{display:none}
  #app{max-width:none;margin:0;margin-inline-start:320px;padding:64px 40px 60px 40px}
  #app.narrow{max-width:760px;margin-inline-start:calc(320px + max(0px,(100vw - 320px - 760px)/2))}
  .masthead>div{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .m1,.m2{font-size:36px;line-height:1.3}.m2{margin-top:0}
  .masthead .cta{position:fixed;top:16px;inset-inline-end:20px;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.12)}
  .chips{display:none}
  h2.mast{font-size:30px;margin-top:30px}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  .tile{height:120px}
  .phsq{width:132px;height:132px}
  .promo{max-width:420px}
  .wide{max-width:420px}
}
.s-top{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 10px 6px}
.s-top button{font-size:17px;min-height:44px}
.s-item{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 12px;border-radius:22px;font-size:17px;text-align:right}
.s-item.on{background:var(--line);color:var(--accent)}
.s-item .sq{width:26px;height:26px;border-radius:6px}
.s-label{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;padding:0 12px;margin-top:14px;font-size:16px;color:var(--muted)}
.s-label i{width:20px;height:20px;border-radius:10px;background:var(--text);color:var(--card);display:flex;align-items:center;justify-content:center}
</style>
</head>

    h+='<button class="wide" data-act="tab" data-id="following"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.6 7.1.7-5.4 4.8 1.6 7L12 17.4 5.8 21l1.6-7L2 9.3l7.1-.7z"/></svg>ޗެނަލްތައް ބަދަލުކުރޭ</button>';}
  var tr=l.slice().sort(function(a,b){return b.src.length-a.src.length;}).filter(function(s){return s.src.length>1;}).slice(0,4);

function count(m){return Object.keys(m).filter(function(k){return m[k]&&byId(k);}).length;}
function statusText(id){var s=data.status[id];return s==='ok'?'ފީޑު ލިބޭ':s==='scraped'?'ވެބްސައިޓުން':s==='noFeed'?'ފީޑެއް ނުފެނުނު':s==='fetchFailed'?'ފީޑު ނުގެނެވުނު':'ބަލަނީ...';}
function glabel(key,text){st.col=st.col||{};var shut=!!st.col[key];

function viewFollowing(){
  st.col=st.col||{};var ed=!!st.edit;
  var h=mast('ފޮލޯކުރާ','<button class="cta ghost" data-act="edit">'+(ed?'ނިމުނީ':'ބަދަލުކުރޭ')+'</button>')+'<div style="height:18px"></div><div class="group">'+
  '<button data-act="list" data-id="saved"><span class="sq"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg></span><span class="grow" style="font-size:17px">ރައްކާކުރި ޚަބަރު</span><span class="muted">'+count(st.saved)+'</span>'+CHEV+'</button>'+
  '<button data-act="list" data-id="read"><span class="sq"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M12 7v5.5H8" fill="none" stroke="var(--card)" stroke-width="2" stroke-linecap="round"/></svg></span><span class="grow" style="font-size:17px">ކިޔުނު ޚަބަރު</span><span class="muted">'+count(st.read)+'</span>'+CHEV+'</button></div>';

      var sq='<span class="sq" style="background:'+CH[k].color+';color:#fff;font-size:12px">'+esc(CH[k].ini)+'</span>';

function results(){var q=st.query.trim();if(!q)return null;
  return data.stories.filter(function(s){return s.src.some(function(x){return x.title.indexOf(q)>=0;})||secName(s.sec).indexOf(q)>=0;});}
function resultsHtml(){var r=results();
  if(r===null)return'<div class="tiles">'+SECS.map(function(s){return'<button class="tile" style="background:'+s.color+';background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 70%)" data-act="sec" data-id="'+s.id+'">'+glyph(s.id,84,1.6)+'<span style="position:relative">'+s.name+'</span></button>';}).join('')+'</div>';
  if(!r.length)return'<p class="muted">އެއްވެސް ޚަބަރެއް ނުފެނުނު.</p>';

function viewSearch(){
  return mast('ހޯދާ')+'<div class="search"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="9" r="6"/><path d="M14 14l4 4"/></svg><label class="sr" for="q">ޚަބަރު ހޯދާ</label><input id="q" type="search" dir="rtl" placeholder="ޚަބަރު ހޯދާ" value="'+esc(st.query)+'"></div><div id="results">'+resultsHtml()+'</div>';}
function listBody(l,empty){
  if(!l.length)return'<p class="muted">'+empty+'</p>';
  if(isWide())return g3(l.slice(0,3).map(leadMore).join(''))+(l.length>3?g3(l.slice(3,63).map(function(s){return compactCard(s);}).join('')):'');
  return l.slice(0,60).map(function(s,i){return i?compactCard(s):leadMore(s);}).join('');}
function viewChannel(id){
  var l=data.stories.filter(function(s){return s.src.some(function(x){return x.channel===id;});});
  var on=!st.unfollowed[id];
  var h='<div class="topbar">'+BACK+'<div class="pillbar"><button data-act="follow" data-id="'+id+'" aria-pressed="'+on+'" aria-label="'+(on?'ފޮލޯކުރަނީ':'ފޮލޯ')+'"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="'+(on?'var(--accent)':'currentColor')+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="'+(on?'M4 10.5l4 4 8-9':'M10 4v12M4 10h12')+'"/></svg></button></div></div>';

  return h+listBody(l,'މި ޗެނަލުން އަދި ޚަބަރެއް ނެތް.');}
function viewSection(id){

  var h='<div class="topbar">'+BACK+'</div><h1 class="mast m1" style="margin-top:22px">'+secName(id)+'</h1><h2 class="mast">މައި ސުރުޚީތައް</h2><div class="sub">ފޮލޯކުރާ ޗެނަލްތަކުން.</div>';
  return h+listBody(l,'މި ބައިގައި އަދި ޚަބަރެއް ނެތް.');}
function viewList(kind){
  var m=kind==='saved'?st.saved:st.read;var l=data.stories.filter(function(s){return m[s.id];});
  var h='<div class="topbar">'+BACK+'</div><h1 class="mast m1" style="margin:22px 0 16px">'+(kind==='saved'?'ރައްކާކުރި ޚަބަރު':'ކިޔުނު ޚަބަރު')+'</h1>';
  if(!l.length)return h+'<p class="muted">އަދި އެއްވެސް ޚަބަރެއް ނެތް.</p>';
  var c=l.map(function(s){return compactCard(s);}).join('');return h+(isWide()?g3(c):c);}
function viewStory(id){
  var s=byId(id);if(!s)return BACK+'<p class="muted">މި ޚަބަރު ނުފެނުނު.</p>';
  var h=BACK+'<div style="height:16px"></div>'+photo(s,220,20)+
  '<div class="accent" style="font-size:14px;font-weight:700;margin-top:16px">'+secName(s.sec)+'</div>'+
  '<h1 class="hl" style="font-size:28px;margin:0">'+esc(s.src[0].title)+'</h1>'+
  '<h2 class="mast" style="font-size:22px">މި ޚަބަރު ގެނެސްދިން ޗެނަލްތައް</h2>';
  return h+s.src.map(function(x,i){
    return'<button class="card pad" style="margin-bottom:12px" data-act="article" data-id="'+esc(s.id)+'" data-i="'+i+'"><div class="row" style="align-items:center;gap:8px">'+badge(x.channel,28)+'<span class="grow chn">'+chName(x.channel)+'</span><span class="meta">'+timeAgo(x.published)+'</span></div><div class="hl" style="font-size:18px;margin-top:6px">'+esc(x.title)+'</div></button>';
  }).join('');}
var EXT='<svg aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4H4v12h12v-4M11 3h6v6M17 3l-8 8"/></svg>';
function viewArticle(id,i){
  var s=byId(id);if(!s)return'<div class="topbar">'+BACK+'</div><p class="muted">މި ޚަބަރު ނުފެނުނު.</p>';
  var x=s.src[i]||s.src[0],liked=!!st.liked[id],saved=!!st.saved[id],cs=st.comments[id]||[];
  var text=x.body||x.summary||'';
  var h='<div class="topbar">'+BACK+
  '<button class="circle" data-act="save" data-id="'+esc(id)+'" aria-label="ރައްކާކުރޭ" aria-pressed="'+saved+'" style="color:'+(saved?'var(--accent)':'var(--text)')+'"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="'+(saved?'currentColor':'none')+'" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3h10v14l-5-3.5L5 17z"/></svg></button></div>'+
  '<div class="row" style="align-items:center;gap:10px;margin:18px 0 10px">'+badge(x.channel,40)+'<div style="line-height:1.5"><div class="chn" style="font-size:18px">'+chName(x.channel)+'</div><div class="meta" style="font-size:13px">'+timeAgo(x.published)+'</div></div></div>'+
  '<h1 class="hl" style="font-size:27px;margin:0 0 14px">'+esc(x.title)+'</h1>'+pic(s,'ph43',x.image)+'<div style="height:4px"></div>';
  h+=text?text.split(/\n\n+/).map(function(p){return'<p class="body">'+esc(p)+'</p>';}).join(''):'<p class="muted" style="margin:16px 0">މި ޚަބަރުގެ ލިޔުން އަދި ނުލިބޭ.</p>';
  if(!x.full)h+='<a class="readon" href="'+esc(x.url)+'" target="_blank" rel="noopener">ބާކީ ބައި '+chName(x.channel)+' އިން ކިޔާލައްވާ '+EXT+'</a>';
  else h+='<a class="srclink" href="'+esc(x.url)+'" target="_blank" rel="noopener">މަސްދަރު: '+chName(x.channel)+' '+EXT+'</a>';

  if(others.length){h+='<h2 class="mast" style="font-size:24px;margin:28px 0 10px">މި ޚަބަރު ގެނެސްދިން އެހެން ޗެނަލްތައް</h2><div class="group">'+others.map(function(y){
    return'<a class="cov" href="'+esc(y.url)+'" target="_blank" rel="noopener">'+badge(y.channel,36)+'<span class="grow" style="line-height:1.5"><span class="chn" style="display:block">'+chName(y.channel)+' <span class="meta" style="font-size:13px;font-weight:400">· '+timeAgo(y.published)+'</span></span><span class="t">'+esc(y.title)+'</span></span><span class="muted">'+EXT+'</span></a>';}).join('')+'</div>';}
  h+='<div class="bar" style="margin-top:24px"><button class="like'+(liked?' on':'')+'" data-act="like" data-id="'+esc(id)+'" aria-pressed="'+liked+'"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="'+(liked?'currentColor':'none')+'" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M10 17s-6.5-3.9-6.5-8.6A3.6 3.6 0 0 1 10 6.2a3.6 3.6 0 0 1 6.5 2.2C16.5 13.1 10 17 10 17z"/></svg><span>ލައިކް '+(liked?1:0)+'</span></button>'+
  '<span class="muted" style="font-size:15px">'+cs.length+' ކޮމެންޓް</span></div>'+
  '<h2 class="mast" style="font-size:22px;margin:16px 0 8px">ކޮމެންޓްތައް</h2>';
  if(!cs.length)h+='<p class="muted" style="font-size:14px">އަދި ކޮމެންޓެއް ނެތް. ފުރަތަމަ ކޮމެންޓް ކުރައްވާ.</p>';
  h+=cs.map(function(c){return'<div class="comment"><div style="font-size:13px;color:var(--muted)">ތިބާ</div><div style="font-family:var(--f-body);font-size:16px;overflow-wrap:anywhere">'+esc(c)+'</div></div>';}).join('');

  return h;}

// ---------- shell ----------
var app=document.getElementById('app'),nav=document.getElementById('nav'),side=document.getElementById('side');
var TABS=[['feed','މިއަދު','M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zM7.5 8v2h9V8zM7.5 12v2h9v-2zM7.5 16v2h5v-2z',1],['following','ފޮލޯކުރާ','M5 10h14v10a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1zM7 6.5h10V8H7zM9 3.5h6V5H9z',1],['search','ހޯދާ','M10.5 17a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13zM15.5 15.5L21 21',0]];
function top(){return st.stack.length?st.stack[st.stack.length-1]:{v:st.tab};}
function render(keepScroll){
  var t=top(),h;
  if(t.v==='feed')h=viewFeed();else if(t.v==='following')h=viewFollowing();else if(t.v==='search')h=viewSearch();
  else if(t.v==='sec')h=viewSection(t.id);else if(t.v==='chan')h=viewChannel(t.id);else if(t.v==='list')h=viewList(t.id);else if(t.v==='story')h=viewStory(t.id);else h=viewArticle(t.id,t.i);
  app.innerHTML=h;app.className=(t.v==='story'||t.v==='article')?'narrow':'';
  side.innerHTML=isWide()?sideHtml():'';
  nav.innerHTML=TABS.map(function(x){return'<button data-tab="'+x[0]+'" class="'+(st.tab===x[0]?'on':'')+'"'+(st.tab===x[0]?' aria-current="page"':'')+'><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" '+(x[3]?'fill="currentColor" fill-rule="evenodd"':'fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"')+'><path d="'+x[2]+'"/></svg><span>'+x[1]+'</span></button>';}).join('');
  if(!keepScroll)window.scrollTo(0,0);}
function push(o){st.stack.push(o);render();}
nav.addEventListener('click',function(e){var b=e.target.closest('button[data-tab]');if(!b)return;st.tab=b.getAttribute('data-tab');st.stack=[];render();});
function onAct(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var act=b.getAttribute('data-act'),id=b.getAttribute('data-id');
  if(act==='back'){st.stack.pop();render();}
  else if(act==='refresh')load();
  else if(act==='edit'){st.edit=!st.edit;render(true);}
  else if(act==='sedit'){st.edit=!st.edit;st.tab='following';st.stack=[];render();}
  else if(act==='col'){st.col=st.col||{};st.col[id]=!st.col[id];render(true);}
  else if(act==='sec'||act==='chan'||act==='list'){if(this===side)st.stack=[];push({v:act,id:id});}
  else if(act==='tab'){st.tab=id;st.stack=[];render();}
  else if(act==='story'){if(!byId(id))return;st.read[id]=true;persist();push({v:'article',id:id,i:0});}
  else if(act==='article'){st.read[id]=true;persist();push({v:'article',id:id,i:+b.getAttribute('data-i')});}
  else if(act==='follow'){st.unfollowed[id]=!st.unfollowed[id];persist();rebuild();render(true);}
  else if(act==='like'){st.liked[id]=!st.liked[id];persist();render(true);}
  else if(act==='save'){st.saved[id]=!st.saved[id];persist();render(true);}
}
app.addEventListener('click',onAct);side.addEventListener('click',onAct);
if(mq){(mq.addEventListener?mq.addEventListener('change',function(){render(true);}):mq.addListener(function(){render(true);}));}
app.addEventListener('input',function(e){if(e.target.id!=='q')return;st.query=e.target.value;var r=document.getElementById('results');if(r)r.innerHTML=resultsHtml();});
app.addEventListener('submit',function(e){e.preventDefault();var f=e.target,id=f.getAttribute('data-id'),inp=f.querySelector('input');if(!id||!inp)return;var t=inp.value.trim();if(!t)return;(st.comments[id]=st.comments[id]||[]).push(t);persist();render(true);});
render();load();
})();
